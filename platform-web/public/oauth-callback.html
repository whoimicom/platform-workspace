<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正在登录...</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #273248; background: #f5f7fb;
    }
    .tip { font-size: 13px; color: #98a2b3; }
  </style>
</head>
<body>
<div class="tip">登录完成，请稍候...</div>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var state = params.get('state');
    if (!code) return;

    // 内嵌二维码模式：扫码后官方 iframe 会跳到本页，这里把 code 回传给父页面（同域）
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(
        { type: 'oauth-callback', code: code, state: state },
        window.location.origin
      );
      return;
    }

    // 整页模式兜底：前端使用 hash 路由，转发到 /#/login?code=xxx&state=xxx
    var base = window.location.pathname.replace(/oauth-callback\.html$/, '') + '#/login';
    var query = [];
    query.push('code=' + encodeURIComponent(code));
    if (state) query.push('state=' + encodeURIComponent(state));
    window.location.replace(base + '?' + query.join('&'));
  })();
</script>
</body>
</html>
