server:
  # 前端 .env.development 的 API_PROXY_TARGET 默认指向 8000
  port: 8000

spring:
  application:
    name: platform-api
  datasource:
    # 数据库配置允许环境变量覆盖，便于不同环境部署
    url: ${MYSQL_P_URL:jdbc:mysql://127.0.0.1:3306/platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_P_USERNAME:platform}
    password: ${MYSQL_P_PASSWORD:platform123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      # 表结构由 sql/platform_api.sql 手动导入，启动时不执行建表脚本
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      password: ${REDIS_PASSWORD:}
      database: 13
      port: 6379
app:
  # 是否校验图形验证码（前端登录页默认展示验证码）
  captcha-enabled: true
  # 新增用户及 SQL 初始账号 NEED_INIT 的默认密码
  default-password: 123456
  jwt:
    # 至少 32 字节，生产环境务必修改
    secret: platform-api-default-secret-change-me-0123456789abcdef
    # 访问令牌有效期（秒）
    access-expire-seconds: 1800
    # 刷新令牌有效期（秒）
    refresh-expire-seconds: 604800
  access-log:
    # 接口访问日志总开关（打印请求/返回报文、耗时、traceId）
    enabled: true
    # 请求/返回报文最大记录长度，超出截断
    max-body-length: 4096
    # 慢请求阈值（毫秒），超过以 WARN 输出
    slow-threshold-ms: 3000

