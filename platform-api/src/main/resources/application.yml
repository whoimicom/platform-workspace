server:
  # 前端 .env.development 的 API_PROXY_TARGET 默认指向 8000
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: platform-api
  datasource:
    # 优先读取环境变量，未设置时使用默认值
    url: ${MYSQL_A_URL:jdbc:mysql://localhost:3306/admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_A_USERNAME:root}
    password: ${MYSQL_A_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      # 表结构由 sql/platform_api.sql 手动导入，启动时不执行建表脚本
      mode: never

app:
  # 是否校验图形验证码（前端登录页默认展示验证码）
  captcha-enabled: ${APP_CAPTCHA_ENABLED:true}
  # 新增用户及 SQL 初始账号 NEED_INIT 的默认密码
  default-password: ${APP_DEFAULT_PASSWORD:123456}
  jwt:
    # 至少 32 字节，生产环境务必通过环境变量覆盖
    secret: ${JWT_SECRET:platform-api-default-secret-change-me-0123456789abcdef}
    # 访问令牌有效期（秒）
    access-expire-seconds: ${JWT_ACCESS_EXPIRE:1800}
    # 刷新令牌有效期（秒）
    refresh-expire-seconds: ${JWT_REFRESH_EXPIRE:604800}
